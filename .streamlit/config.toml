# Thème "console SOC" : graphite sobre, bordures fines, densité élevée.
# Le CSS custom (app/assets/style.css) ne couvre que ce que le thème ne peut pas faire.
[theme]
base = "dark"
primaryColor = "#3b82f6"
backgroundColor = "#0f1115"
secondaryBackgroundColor = "#171a21"
textColor = "#d5d9e0"
borderColor = "#262b35"
linkColor = "#60a5fa"
codeBackgroundColor = "#171a21"
showWidgetBorder = true
baseRadius = "4px"
buttonRadius = "4px"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
baseFontSize = 14
headingFontSizes = ["22px", "18px", "15px", "14px", "13px", "12px"]
headingFontWeights = [600, 600, 600, 600, 500, 500]
metricValueFontSize = "1.6rem"
metricValueFontWeight = 600
linkUnderline = false

redColor = "#e5484d"
greenColor = "#30a46c"
orangeColor = "#f59e0b"
blueColor = "#3b82f6"
grayColor = "#7c8594"

dataframeBorderColor = "#262b35"
dataframeHeaderBackgroundColor = "#1c2029"
dataframeHeaderTextColor = "#9aa3b2"

chartCategoricalColors = ["#3b82f6", "#30a46c", "#e5484d", "#f59e0b", "#8b5cf6", "#7c8594"]
